services:
  - type: web
    name: web-crawler-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: OLLAMA_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: CRAWL_MAX_PAGES
        value: "5"
      - key: CRAWL_MAX_DEPTH
        value: "2"
